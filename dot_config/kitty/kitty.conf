# ============================================================
# ~/.config/kitty/kitty.conf — Kitty 终端配置
# ============================================================

# ---------- 1. 字体设置 ----------
# 主字体（推荐使用 Nerd Font 以支持图标）
font_family      0xProto Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# 字号大小
font_size 11.0

# 调整行距和字符间距（单位：pt）
adjust_line_height  2
adjust_column_width 0

# 启用连字支持（JetBrains Mono 等字体支持 -> != >=）
disable_ligatures never

# ---------- 2. 光标设置 ----------
# 光标形状：block（方块）| beam（竖线）| underline（下划线）
cursor_shape beam

# 光标闪烁间隔（秒），设为 0 禁用闪烁
cursor_blink_interval 0.5

# 光标颜色（none 表示跟随文本前景色）
cursor none

# Shell 集成时停止闪烁
cursor_stop_blinking_after 15.0

# ---------- 3. 滚动设置 ----------
# 回滚缓冲区行数（-1 为无限）
scrollback_lines 10000

# 用于 scrollback_pager 的内存限制（MB）
scrollback_pager_history_size 64

# 使用 less 作为回滚分页器
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# 滚动速度（每次滚轮滚动的行数）
wheel_scroll_multiplier 5.0

# 触控板滚动速度
touch_scroll_multiplier 1.0

# ---------- 4. 鼠标设置 ----------
# 点击链接时打开浏览器
open_url_with default

# 检测 URL 并允许点击打开
detect_urls yes

# URL 下划线样式
url_style curly

# 链接颜色
url_color #61afef

# 鼠标隐藏延迟（秒），0 表示不隐藏
mouse_hide_wait 3.0

# 复制到剪贴板时同时复制到选区（类 X11 行为）
copy_on_select clipboard

# ---------- 5. 窗口布局 ----------
# 支持的布局：fat, grid, horizontal, splits, stack, tall, vertical
enabled_layouts splits, stack, tall, fat

# 窗口内边距（pt）
window_padding_width 3

# 窗口边框宽度
window_border_width 1pt

# 活动窗口边框颜色
active_border_color #61afef

# 非活动窗口边框颜色
inactive_border_color #3e4452

# 非活动窗口文字透明度（1.0 为不透明）
inactive_text_alpha 0.85

# 新窗口默认尺寸（字符列 x 行）
remember_window_size  yes
initial_window_width  120c
initial_window_height 36c

# 窗口装饰（titlebar-only 在 macOS 上仅显示标题栏按钮）
hide_window_decorations no

# macOS 标题栏颜色跟随主题
macos_titlebar_color background

# ---------- 6. 标签栏设置 ----------
# 标签栏位置：top | bottom
tab_bar_edge bottom

# 标签栏样式：fade | slant | separator | powerline | custom | hidden
tab_bar_style powerline

# Powerline 样式的分隔符形状
tab_powerline_style slanted

# 标签标题模板
tab_title_template "{index}:{title}"

# 活动标签标题模板
active_tab_title_template "{index}:{title} *"

# 活动标签样式
active_tab_foreground   #282c34
active_tab_background   #ef8261
active_tab_font_style   bold

# 非活动标签样式
inactive_tab_foreground #abb2bf
inactive_tab_background #3e4452
inactive_tab_font_style normal

# 标签栏背景色
tab_bar_background #21252b

# ---------- 7. 配色方案 ----------
# 背景透明度（需要合成器支持）
background_opacity 0.95

# selection_foreground #282c34
# selection_background #61afef

# # 前景与背景
foreground            #f8f8f2
background            #282a36
# # 选区颜色
selection_foreground  #ffffff
selection_background  #44475a

url_color #8be9fd
color0  #21222c
color8  #6272a4
color1  #ff5555
color9  #ff6e6e
color2  #50fa7b
color10 #69ff94
color3  #f1fa8c
color11 #ffffa5
color4  #bd93f9
color12 #d6acff
color5  #ff79c6
color13 #ff92df
color6  #8be9fd
color14 #a4ffff
color7  #f8f8f2
color15 #ffffff
cursor            #f8f8f2
cursor_text_color background

mark1_foreground #282a36
mark1_background #ff5555

# ---------- 8. 声音与通知 ----------
# 关闭响铃声音
enable_audio_bell no

# 窗口闪烁提示
visual_bell_duration 0.0

# 响铃时在标签栏显示标记
bell_on_tab "🔔 "

# ---------- 9. 快捷键绑定 ----------
# 清除所有默认快捷键（可选，按需取消注释）
# clear_all_shortcuts yes

# -- 剪贴板 --
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

# -- 字体缩放 --
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# -- 窗口管理 --
# 新建窗口（splits 布局下水平/垂直分屏）
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+=     launch --location=vsplit --cwd=current
map ctrl+shift+-     launch --location=hsplit --cwd=current
map ctrl+shift+c close_window

# 窗口切换（Vim 风格）
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# 窗口大小调整
map ctrl+shift+r start_resizing_window

# 切换布局
map ctrl+shift+space next_layout

# -- 标签页管理 --
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map ctrl+shift+right    move_tab_forward
map ctrl+shift+left     move_tab_backward

# 按编号切换标签页
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+0 goto_tab 10
map ctrl+tab     goto_tab -1

# -- 滚动 --
map ctrl+shift+up    scroll_line_up
map ctrl+shift+down  scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home  scroll_home
map ctrl+shift+end   scroll_end

# -- 其他 --
# 重新加载配置
map ctrl+shift+f5 load_config_file

# 打开 Kitty Shell（调试用）
map ctrl+shift+escape kitty_shell window

# 查看快捷键帮助
map ctrl+shift+f1 show_kitty_doc overview

# ---------- 10. 高级设置 ----------
# Shell 集成（提供命令行编辑增强）
shell_integration enabled

# 允许远程控制（通过 kitty @ 命令控制 Kitty）
allow_remote_control socket-only
listen_on unix:/tmp/mykitty

# 确认关闭窗口（-1 = 有进程运行时询问）
confirm_os_window_close -1

# 剪贴板最大大小（MB）
clipboard_max_size 512

# 更新检查间隔（小时），0 禁用
update_check_interval 0
