[Greeter]
background=/usr/local/share/backgrounds/graphite-login.png
background-color=#15191e
draw-user-backgrounds=false
draw-grid=false
show-hostname=false
show-power=true
show-a11y=false
show-keyboard=true
show-clock=true
show-quit=true
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=Noto Sans 11
xft-antialias=true
xft-hintstyle=hintslight
enable-hidpi=auto
only-on-monitor=-1
stretch-background-across-monitors=false
clock-format=%H:%M
content-align=center
